name: Actualización semanal de datos
on:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Descargar universo global
        run: node scripts/fetch-universe.mjs
      - name: Construir datos de la app
        run: node scripts/build-data.mjs
      - name: Snapshot semanal de predicciones
        run: node scripts/snapshot-predictions.mjs
      - name: Descripciones de empresas nuevas
        run: node scripts/fetch-profiles.mjs || true
      - name: Señales cualitativas (insiders, short interest, fundador, revisiones EPS)
        run: node scripts/fetch-signals.mjs --budgetMin 90 || true
      - name: Commit (dispara el redeploy en Vercel)
        run: |
          git config user.name "asymmetric-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/profiles.json
          git add data/signals.json data/dilution_us.json 2>/dev/null || git add data/signals.json || true
          git add data/predictions
          git commit -m "data: actualización semanal $(date -u +%F)" || git commit --allow-empty -m "data: actualización semanal $(date -u +%F)"
          git push
